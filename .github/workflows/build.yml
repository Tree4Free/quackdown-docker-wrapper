name: Build on upstream release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          VERSION=$(gh release view --repo iamgio/quarkdown --json tagName -q .tagName)
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already built
        id: check
        run: |
          if docker manifest inspect ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          push: true
          build-args: TOOL_VERSION=${{ steps.upstream.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
